[project]
name = "moda-claude-agent-sdk"
version = "0.1.1"
description = "Moda Claude Agent SDK instrumentation for LLM observability"
authors = [
  { name = "Moda Labs", email = "support@moda.so" },
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
  "opentelemetry-api>=1.38.0,<2",
  "opentelemetry-instrumentation>=0.59b0",
  "opentelemetry-semantic-conventions-ai>=0.4.13,<0.5.0",
  "opentelemetry-semantic-conventions>=0.59b0",
]

[project.urls]
Repository = "https://github.com/ModaLabs/moda-python/tree/main/packages/moda-claude-agent-sdk"

[project.optional-dependencies]
instruments = ["claude-agent-sdk"]

[project.entry-points."opentelemetry_instrumentor"]
claude_agent_sdk = "opentelemetry.instrumentation.claude_agent_sdk:ClaudeAgentSDKInstrumentor"

[dependency-groups]
dev = [
  "autopep8>=2.2.0,<3",
  "pytest-sugar==1.0.0",
  "pytest>=8.2.2,<9",
  "ruff>=0.4.0",
]
test = [
  "opentelemetry-sdk>=1.38.0,<2",
  "pytest-asyncio>=0.23.7,<0.24.0",
  "pytest-sugar==1.0.0",
  "pytest>=8.2.2,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opentelemetry"]

[tool.coverage.run]
branch = true
source = ["opentelemetry/instrumentation/claude_agent_sdk"]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:"]
show_missing = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
exclude = [
  ".git",
  "__pycache__",
  "build",
  "dist",
  ".venv",
  ".pytest_cache",
]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.uv]
constraint-dependencies = ["urllib3>=2.6.3", "pip>=25.3"]
