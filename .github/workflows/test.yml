name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: false

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (moda)
        working-directory: packages/moda
        run: uv sync --all-extras --dev

      - name: Install dependencies (moda-openai)
        working-directory: packages/moda-openai
        run: uv sync --all-extras --dev

      - name: Install dependencies (moda-anthropic)
        working-directory: packages/moda-anthropic
        run: uv sync --all-extras --dev

      - name: Run unit tests
        run: |
          cd packages/moda
          uv run pytest ../../tests/test_conversation.py -v

      - name: Run integration tests
        run: |
          cd packages/moda
          uv run pytest ../../tests/test_integration.py -v

      - name: Run moda-openai tests
        working-directory: packages/moda-openai
        run: uv run pytest tests/ -v --ignore=tests/metrics
        continue-on-error: true

      - name: Run moda-anthropic tests
        working-directory: packages/moda-anthropic
        run: uv run pytest tests/ -v
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: packages/moda
        run: uv sync --dev

      - name: Run ruff
        working-directory: packages/moda
        run: uv run ruff check traceloop/

      - name: Check workflow pins
        working-directory: packages/moda
        run: uv run pytest ../../tests/test_workflow_pins.py -v
